[project]
name = "ctx-semantic"
version = "0.1.0"
description = "Hybrid semantic recall sidecar for the context-mode knowledge base"
requires-python = ">=3.10"
dependencies = [
    # fastembed[gpu] extra was removed upstream in 0.8.0; fastembed-gpu is the
    # official GPU distribution (same `fastembed` module, onnxruntime-gpu backend)
    "fastembed-gpu",
    "mcp",
    "numpy",
    # onnxruntime-gpu ships CUDA libs as optional extras and uv cannot enable
    # extras on a transitive dependency, so request them directly
    "onnxruntime-gpu[cuda,cudnn]<1.24",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ctx_semantic"]

[tool.pytest.ini_options]
markers = [
    "integration: touches real on-disk context-mode DBs (read-only opens)",
]

[tool.coverage.run]
source = ["ctx_semantic"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
